<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HeyReach — Campaign Dashboard</title>
<style>
/* ── Design tokens ── */
:root {
  --bg:        #191919;
  --surf:      #252525;
  --surf2:     #2f2f2f;
  --brd:       rgba(255,255,255,0.08);
  --t1:        #ffffff;
  --t2:        #9b9b9b;
  --t3:        #5a5a5a;
  --accent:    #5b8dee;
  --a-bg:      rgba(91,141,238,0.12);
  --c-run:     #5b8dee;
  --c-pause:   #d9a84e;
  --c-fin:     #4ea676;
  --c-draft:   #6b6b6b;
  --c-fail:    #d96b64;
  --c-conn:    #a882e0;
  --bar-bg:    rgba(255,255,255,0.08);
  --row-hover: rgba(255,255,255,0.03);
  --q-fill:    #4ea676;
  --q-gap:     #a82f28;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--t1);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 13px;
  line-height: 1.5;
  min-height: 100vh;
  padding-bottom: 56px;
}

/* ── Header ── */
.hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 28px 0;
  gap: 12px;
}
.hdr-left { display: flex; align-items: center; gap: 10px; }
.hdr-logo {
  width: 28px; height: 28px;
  border-radius: 7px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: #fff; letter-spacing: -0.03em;
  flex-shrink: 0;
}
.hdr-title { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
.hdr-sub { font-size: 11px; color: var(--t3); margin-top: 1px; }
.hdr-right { font-size: 11px; color: var(--t3); text-align: right; }
.live-dot {
  display: inline-block;
  width: 6px; height: 6px;
  background: var(--c-fin);
  border-radius: 50%;
  margin-right: 5px;
  vertical-align: middle;
}

/* ── KPI row ── */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
  padding: 18px 28px;
}
.kpi {
  background: var(--surf);
  border: 1px solid var(--brd);
  border-radius: 9px;
  padding: 14px 16px 13px;
}
.kpi-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--t3);
  margin-bottom: 7px;
}
.kpi-num {
  font-size: 30px;
  font-weight: 700;
  letter-spacing: -0.035em;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.kpi-sub {
  font-size: 10px;
  color: var(--t3);
  margin-top: 4px;
}
.k-run  { color: #ffffff; }
.k-paus { color: #ffffff; }
.k-fin  { color: #ffffff; }
.k-fail { color: #ffffff; }
.k-tot  { color: #ffffff; }
.k-conn { color: #ffffff; }

/* ── Filter tabs ── */
.filters {
  display: flex;
  gap: 2px;
  padding: 0 28px 14px;
  align-items: center;
  flex-wrap: wrap;
}
.filter-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  color: var(--t3);
  padding: 5px 12px;
  border-radius: 6px;
  transition: background 0.1s, color 0.1s;
}
.filter-btn:hover { background: var(--surf2); color: var(--t2); }
.filter-btn.on    { background: var(--a-bg); color: var(--accent); }
.filter-pill {
  display: inline-block;
  margin-left: 4px;
  font-size: 10px;
  opacity: 0.75;
  font-variant-numeric: tabular-nums;
}

/* ── Dashboard card ── */
.dash-card {
  margin: 16px 28px 0;
}
.dash-section-border {
  border: 1px solid var(--brd);
  border-radius: 12px;
  overflow: hidden;
  background: var(--surf);
  margin-bottom: 40px;
}
.filters {
  padding: 14px 20px 4px !important;
}
.search-row {
  padding: 0 20px 10px !important;
}
.sort-row {
  padding: 0 20px 10px !important;
}
.tbl-wrap {
  padding: 0 !important;
  overflow-x: auto;
}

/* ── Campaign search ── */
.search-row {
  padding: 0 28px 12px;
}
.search-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
  width: 260px;
}
.search-icon {
  position: absolute;
  left: 9px;
  color: var(--t3);
  font-size: 15px;
  pointer-events: none;
  line-height: 1;
}
.search-input {
  width: 100%;
  background: var(--surf);
  border: 1px solid var(--brd);
  border-radius: 7px;
  color: var(--t1);
  font-size: 12px;
  font-family: inherit;
  padding: 6px 28px 6px 28px;
  outline: none;
  transition: border-color 0.15s;
}
.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--t3); }
.search-clear {
  position: absolute;
  right: 7px;
  background: none;
  border: none;
  color: var(--t3);
  font-size: 11px;
  cursor: pointer;
  padding: 2px 3px;
  display: none;
  line-height: 1;
}
.search-clear:hover { color: var(--t1); }
.search-clear.visible { display: block; }

/* ── Sort controls ── */
.sort-row {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
  padding: 0 28px 10px;
  font-size: 11px;
  color: var(--t3);
}
.sort-row select {
  background: var(--surf);
  border: 1px solid var(--brd);
  border-radius: 5px;
  color: var(--t2);
  font-size: 11px;
  font-family: inherit;
  padding: 4px 8px;
  outline: none;
  cursor: pointer;
}

/* ── Table ── */
.tbl-wrap {
  padding: 0 28px;
  overflow-x: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
}
thead th {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--t3);
  padding: 10px 10px;
  background: var(--surf);
  border-bottom: 1px solid var(--brd);
  border-right: 1px solid var(--brd);
  text-align: left;
  white-space: normal;
  word-break: break-word;
  cursor: pointer;
  user-select: none;
  line-height: 1.35;
}
thead th:last-child { border-right: none; }
thead th:hover { color: var(--t2); }
thead th.th-r { text-align: right; }
thead th.sorted { color: var(--accent); }
thead th .sort-arrow { margin-left: 3px; opacity: 0.5; }
thead th.sorted .sort-arrow { opacity: 1; }

tbody tr {
  border-bottom: 1px solid var(--brd);
  transition: background 0.08s;
}
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--row-hover); }

td {
  padding: 11px 10px;
  vertical-align: middle;
  border-right: 1px solid var(--brd);
}
td:last-child { border-right: none; }

.td-name {
  width: 35%;
  min-width: 240px;
}
.camp-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--t1);
  white-space: normal;
  word-break: break-word;
  display: block;
  line-height: 1.4;
  text-decoration: none;
}
.camp-name:hover {
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.camp-id {
  font-size: 10px;
  color: var(--t3);
  margin-top: 2px;
}

/* Status badge */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.04em;
  padding: 3px 7px;
  border-radius: 4px;
  white-space: nowrap;
}
.bdot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.b-run   { background: rgba(91,141,238,0.12); color: var(--c-run); }
.b-run   .bdot { background: var(--c-run); }
.b-pause { background: rgba(217,168,78,0.12); color: var(--c-pause); }
.b-pause .bdot { background: var(--c-pause); }
.b-fin   { background: rgba(78,166,118,0.12); color: var(--c-fin); }
.b-fin   .bdot { background: var(--c-fin); }
.b-draft { background: rgba(107,107,107,0.12); color: var(--c-draft); }
.b-draft .bdot { background: var(--c-draft); }
.b-fail  { background: rgba(217,107,100,0.12); color: var(--c-fail); }
.b-fail  .bdot { background: var(--c-fail); }

/* Numeric cells */
.num-cell { text-align: right; padding-left: 6px; padding-right: 10px; }
.num-big  { font-size: 13px; font-weight: 600; color: #ffffff; }
.num-seq  { color: #ffffff; }
.num-conn { color: #ffffff; }
.num-pend { color: #ffffff; }
.num-fin  { color: #ffffff; }
.num-fail { color: #ffffff; }
.num-est  { font-style: italic; opacity: 0.75; }
.num-nil  { color: var(--t3); font-size: 11px; }

/* Sender badges */
.td-sender { white-space: nowrap; }
.sender-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 5px;
  margin: 1px 2px 1px 0;
  letter-spacing: 0.01em;
  color: #fff;
}
.col-filter-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--t2);
  font-size: 15px;
  padding: 0 2px;
  line-height: 1;
  vertical-align: middle;
  transition: color 0.1s;
}
.col-filter-btn:hover { color: var(--t1); }
.sender-filter-dot {
  display: inline-block;
  width: 5px; height: 5px;
  background: var(--accent);
  border-radius: 50%;
  margin-right: 2px;
  vertical-align: middle;
}

/* Sender dropdown */
.col-filter-dropdown {
  position: absolute;
  z-index: 200;
  background: var(--surf);
  border: 1px solid var(--brd);
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  min-width: 200px;
  padding: 6px 0;
  font-size: 12px;
}
.cfd-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 12px 8px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--t3);
  border-bottom: 1px solid var(--brd);
  margin-bottom: 4px;
}
.cfd-clear {
  background: none; border: none; cursor: pointer;
  color: var(--accent); font-size: 10px; font-family: inherit;
  padding: 0;
}
.cfd-clear:hover { opacity: 0.8; }
.cfd-footer {
  border-top: 1px solid var(--brd);
  padding: 6px 12px 4px;
  margin-top: 4px;
  text-align: right;
}
.cfd-apply {
  background: var(--accent); border: none; border-radius: 5px;
  color: #fff; font-size: 11px; font-family: inherit; font-weight: 600;
  padding: 5px 14px; cursor: pointer;
}
.cfd-apply:hover { opacity: 0.88; }
.cfd-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  cursor: pointer;
  transition: background 0.08s;
}
.cfd-row:hover { background: var(--surf2); }
.cfd-row input[type="checkbox"] {
  accent-color: var(--accent);
  width: 13px; height: 13px;
  cursor: pointer; flex-shrink: 0;
}
.cfd-name { flex: 1; color: var(--t1); }
.cfd-lastName { color: var(--t2); }
.cfd-select-all-row { background: var(--surf2); }
.cfd-divider { border-top: 1px solid var(--brd); margin: 2px 0; }
.cfd-count {
  font-size: 10px;
  color: var(--t3);
  background: var(--surf2);
  border-radius: 3px;
  padding: 1px 5px;
  font-variant-numeric: tabular-nums;
}

/* Progress bar */
.prog-cell { min-width: 120px; max-width: 160px; }
.prog-bar {
  height: 5px;
  background: var(--bar-bg);
  border-radius: 3px;
  display: flex;
  overflow: hidden;
  gap: 1px;
}
.seg { height: 100%; border-radius: 1px; min-width: 1px; }
.seg-seq  { background: var(--c-run); }
.seg-pend { background: var(--c-pause); }
.seg-fin  { background: var(--c-fin); }
.seg-fail { background: var(--c-fail); }
.seg-stop { background: var(--c-draft); }
.prog-nums {
  font-size: 9px;
  color: var(--t3);
  margin-top: 3px;
  white-space: nowrap;
  letter-spacing: 0.01em;
}

/* Legend */
.legend {
  display: flex;
  gap: 16px;
  padding: 16px 28px 0;
  flex-wrap: wrap;
}
.leg-item {
  display: flex; align-items: center; gap: 5px;
  font-size: 10px; color: var(--t3);
}
.leg-sq {
  width: 9px; height: 9px;
  border-radius: 2px; flex-shrink: 0;
}
.ls-seq  { background: var(--c-run); }
.ls-pend { background: var(--c-pause); }
.ls-fin  { background: var(--c-fin); }
.ls-fail { background: var(--c-fail); }
.ls-stop { background: var(--c-draft); }

/* Note */
.note {
  margin: 18px 28px 0;
  padding: 10px 14px;
  background: var(--surf);
  border: 1px solid var(--brd);
  border-left: 3px solid var(--c-pause);
  border-radius: 6px;
  font-size: 11px;
  color: var(--t2);
  line-height: 1.6;
}
.note strong { color: var(--t1); }

@media (max-width: 1100px) {
  .kpi-row { grid-template-columns: repeat(3,1fr); }
}
@media (max-width: 900px) {
  .hdr { padding-left:16px; padding-right:16px; }
  .dash-card { margin-left:16px; margin-right:16px; }
  .dash-section-border { border-radius: 8px; }
}
@media (max-width: 600px) {
  .kpi-row { grid-template-columns: repeat(2,1fr); }
}

/* ── Workspace selector ── */
.ws-bar {
  display: flex; align-items: center; gap: 8px;
}
.ws-select {
  background: var(--surf2);
  border: 1px solid var(--brd);
  border-radius: 7px;
  color: var(--t1);
  font-size: 12px;
  font-family: inherit;
  font-weight: 500;
  padding: 5px 10px;
  cursor: pointer;
  outline: none;
  max-width: 180px;
}
.ws-select:focus { border-color: var(--accent); }
.icon-btn {
  background: var(--surf2);
  border: 1px solid var(--brd);
  border-radius: 7px;
  color: var(--t2);
  font-size: 14px;
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: color 0.1s, background 0.1s;
}
.icon-btn:hover { color: var(--t1); background: var(--surf); }
.icon-btn.spinning .spin-icon { display: inline-block; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.sync-status {
  font-size: 10px;
  color: var(--t3);
  white-space: nowrap;
}
.sync-ok  { color: var(--c-fin); }
.sync-err { color: var(--c-fail); }

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  display: flex; align-items: center; justify-content: center;
}
.modal-overlay.hidden { display: none; }
.modal-box {
  background: var(--surf);
  border: 1px solid var(--brd);
  border-radius: 14px;
  width: 420px;
  max-width: calc(100vw - 32px);
  max-height: 80vh;
  overflow-y: auto;
  padding: 24px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.4);
}
.modal-hdr {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
}
.modal-hdr h3 { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
.modal-close {
  background: none; border: none;
  color: var(--t3); font-size: 16px;
  cursor: pointer; width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px;
}
.modal-close:hover { background: var(--surf2); color: var(--t1); }
.ws-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
.ws-item {
  display: flex; align-items: center; gap: 10px;
  background: var(--surf2); border: 1px solid var(--brd);
  border-radius: 9px; padding: 10px 12px;
  cursor: pointer; transition: border-color 0.1s;
}
.ws-item:hover { border-color: var(--accent); }
.ws-item.active { border-color: var(--accent); background: var(--a-bg); }
.ws-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--t3); flex-shrink: 0; }
.ws-item.active .ws-dot { background: var(--c-fin); }
.ws-info { flex: 1; min-width: 0; }
.ws-name { font-size: 13px; font-weight: 500; color: var(--t1); }
.ws-key-hint { font-size: 10px; color: var(--t3); margin-top: 2px; }
.ws-del {
  background: none; border: none; color: var(--t3);
  cursor: pointer; font-size: 13px; padding: 2px 6px;
  border-radius: 4px;
}
.ws-del:hover { color: var(--c-fail); background: rgba(224,88,88,0.1); }
.divider { border: none; border-top: 1px solid var(--brd); margin: 20px 0; }
.modal-section-title {
  font-size: 11px; font-weight: 600; letter-spacing: 0.07em;
  text-transform: uppercase; color: var(--t3); margin-bottom: 12px;
}
.field { margin-bottom: 12px; }
.field label { font-size: 11px; color: var(--t2); display: block; margin-bottom: 5px; }
.field input {
  width: 100%; background: var(--surf2);
  border: 1px solid var(--brd); border-radius: 7px;
  color: var(--t1); font-family: inherit; font-size: 13px;
  padding: 8px 10px; outline: none;
  box-sizing: border-box;
}
.field input:focus { border-color: var(--accent); }
.btn-primary {
  background: var(--accent); color: #fff;
  border: none; border-radius: 7px;
  font-family: inherit; font-size: 13px; font-weight: 600;
  padding: 9px 18px; cursor: pointer; width: 100%;
  transition: opacity 0.1s;
}
.btn-primary:hover { opacity: 0.88; }
.api-error {
  margin-top: 10px; padding: 8px 12px;
  background: rgba(224,88,88,0.1);
  border: 1px solid rgba(224,88,88,0.25);
  border-radius: 6px; font-size: 11px; color: var(--c-fail);
  display: none;
}
.lead-count {
  font-size: 10px; color: var(--t3); margin-top: 2px;
}
.lead-count strong { color: var(--accent); }

/* ── Totals footer row ── */
tfoot tr {
  border-top: 2px solid var(--brd);
  background: var(--surf2);
}
tfoot td {
  padding: 11px 10px;
  vertical-align: middle;
  border-right: 1px solid var(--brd);
}
tfoot td:last-child { border-right: none; }
.tfoot-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--t3);
}
.tfoot-remaining {
  font-size: 15px;
  font-weight: 700;
  color: #ffffff;
  font-variant-numeric: tabular-nums;
}

/* ── Daily connection quota (fillometer) ── */
.quota-panel {
  background: var(--surf);
  border: 1px solid var(--brd);
  border-radius: 10px;
  padding: 16px 18px;
  margin-bottom: 18px;
}
.quota-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; }
.quota-title { font-size:13px; font-weight:600; color:var(--t1); }
.quota-sub { font-size:11px; color:var(--t2); margin-top:3px; line-height:1.45; }
.quota-pill {
  font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px;
  white-space:nowrap; border:1px solid transparent;
}
.quota-pill.q-ok   { color:var(--c-fin);   background:rgba(78,166,118,0.12);  border-color:rgba(78,166,118,0.30); }
.quota-pill.q-risk { color:var(--c-fail);  background:rgba(217,107,100,0.12); border-color:rgba(217,107,100,0.30); }
.quota-pill.q-unk  { color:var(--c-pause); background:rgba(217,168,78,0.12);  border-color:rgba(217,168,78,0.30); }

.quota-rows { display:flex; flex-direction:column; gap:9px; }
.quota-row { display:grid; grid-template-columns:152px 1fr 172px 76px; align-items:center; gap:12px; }
.quota-name {
  display:flex; align-items:center; gap:7px; min-width:0;
  font-size:12px; color:var(--t1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.quota-bar { display:flex; height:10px; border-radius:5px; overflow:hidden; background:var(--bar-bg); }
.qseg { height:100%; }
.qseg.q-sent { background:var(--q-fill); }
.qseg.q-cov  { background:var(--q-fill); opacity:.45; }
/* The gap keeps its hatch. Green vs red is the one pairing red-green colour blindness
   collapses, so the distinction must not rest on hue alone. */
.qseg.q-gap  { background:repeating-linear-gradient(45deg,
                 var(--q-gap) 0 4px, rgba(168,47,40,.5) 4px 8px); }
.quota-nums { font-size:11px; color:var(--t2); font-variant-numeric:tabular-nums; }
.quota-nums b { color:var(--t1); font-weight:700; }
.quota-flag { font-size:11px; font-weight:700; text-align:right; font-variant-numeric:tabular-nums; }
.quota-flag.q-ok   { color:var(--t3); }
.quota-flag.q-risk { color:var(--c-fail); }
.quota-flag.q-unk  { color:var(--c-pause); }
.quota-legend {
  display:flex; flex-wrap:wrap; gap:14px; margin-top:13px; padding-top:11px;
  border-top:1px solid var(--brd); font-size:10.5px; color:var(--t3);
}
.quota-legend span { display:flex; align-items:center; gap:5px; }
.quota-key { width:9px; height:9px; border-radius:2px; display:inline-block; flex:none; }
@media (max-width: 820px) {
  .quota-row { grid-template-columns:112px 1fr 74px; }
  .quota-nums { display:none; }
}

/* ── Workspace transfer (export / import) ── */
.xfer-row { display:flex; gap:8px; }
.btn-ghost {
  flex:1; background:var(--surf2); color:var(--t1);
  border:1px solid var(--brd); border-radius:7px;
  font-family:inherit; font-size:12px; font-weight:600;
  padding:8px 12px; cursor:pointer; transition:opacity .1s;
}
.btn-ghost:hover { opacity:.75; }
.xfer-panel { margin-top:12px; display:none; }
.xfer-panel textarea {
  width:100%; height:104px; box-sizing:border-box; resize:vertical;
  background:var(--surf2); border:1px solid var(--brd); border-radius:7px;
  color:var(--t1); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11px; line-height:1.45; padding:8px 10px; outline:none; margin-bottom:8px;
}
.xfer-note { margin-top:8px; font-size:11px; line-height:1.5; color:var(--t2); }
.xfer-warn {
  margin-top:8px; padding:8px 10px; border-radius:6px; font-size:11px; line-height:1.5;
  background:rgba(217,168,78,0.10); border:1px solid rgba(217,168,78,0.25); color:var(--c-pause);
}
</style>
</head>
<body>

<!-- Settings modal -->
<div class="modal-overlay hidden" id="settingsModal">
  <div class="modal-box">
    <div class="modal-hdr">
      <h3>Workspaces</h3>
      <button class="modal-close" onclick="closeSettings()">✕</button>
    </div>
    <div class="ws-list" id="wsList"></div>
    <hr class="divider">
    <div class="modal-section-title">Add Workspace</div>
    <div class="field"><label>Company / Workspace name</label><input id="wsName" placeholder="e.g. GrailPay"></div>
    <div class="field"><label>HeyReach API Key</label><input id="wsKey" type="password" placeholder="Paste your API key"></div>
    <div class="api-error" id="apiError"></div>
    <button class="btn-primary" id="saveWsBtn" onclick="saveWorkspace()">Save &amp; Fetch Data</button>

    <hr class="divider">
    <div class="modal-section-title">Move workspaces to another browser</div>
    <div class="xfer-row">
      <button class="btn-ghost" onclick="exportWorkspaces()">Export</button>
      <button class="btn-ghost" onclick="beginImport()">Import</button>
    </div>
    <div class="xfer-panel" id="xferPanel">
      <textarea id="xferBox" spellcheck="false" placeholder="Paste an exported bundle here"></textarea>
      <div class="xfer-row" id="xferActions"></div>
      <div class="xfer-note" id="xferNote"></div>
    </div>
  </div>
</div>

<div class="hdr">
  <div class="hdr-left">
    <div class="hdr-logo">H</div>
    <div>
      <div class="hdr-title">HeyReach Live Dashboard</div>
      <div class="hdr-sub">HeyReach · LinkedIn Outreach</div>
    </div>
  </div>
  <div class="hdr-right" style="display:flex;align-items:center;gap:10px">
    <div class="ws-bar">
      <select class="ws-select" id="wsSelect" onchange="switchWorkspace(this.value)">
        <option value="__demo__">Demo Data</option>
      </select>
      <button class="icon-btn" id="refreshBtn" title="Refresh from HeyReach API" onclick="refreshActive()"><span class="spin-icon">↻</span></button>
      <button class="icon-btn" title="Manage workspaces" onclick="openSettings()">⚙</button>
    </div>
    <div>
      <div style="text-align:right"><span class="live-dot"></span><span id="syncLabel">No workspace — add one via ⚙</span></div>
      <div class="sync-status" id="syncStatus"></div>
    </div>
  </div>
</div>

<div class="dash-card">

<div class="kpi-row" id="kpiRow"></div>

<div class="quota-panel" id="quotaPanel" style="display:none"></div>

<div class="dash-section-border">
  <div class="filters" id="filters"></div>

  <div class="search-row">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" id="campaignSearch" class="search-input" placeholder="Search campaigns…" oninput="renderTable()">
      <button class="search-clear" id="searchClear" onclick="clearSearch()" title="Clear">✕</button>
    </div>
  </div>

  <div class="sort-row">
    Sort by
    <select id="sortSelect" onchange="renderTable()">
      <option value="status">Status</option>
      <option value="name">Name</option>
      <option value="total">Total Leads</option>
      <option value="analyticsCount">Lead Analytics</option>
      <option value="pending">Pending</option>
      <option value="connCheck">Conn. Check</option>
      <option value="remaining">Remaining Leads</option>
    </select>
  </div>

  <div class="tbl-wrap">
    <table>
      <thead>
        <tr>
          <th>Campaign</th>
          <th style="width:90px">Status</th>
          <th id="th-sender" style="width:100px; position:relative">Sender <button class="col-filter-btn" onclick="toggleSenderDropdown(event)" title="Filter by sender">▾</button></th>
          <th class="th-r" style="width:70px" onclick="setSort('total')" id="th-total">Total <span class="sort-arrow">↕</span></th>
          <th class="th-r" style="width:85px" onclick="setSort('analyticsCount')" id="th-analyticsCount" title="Total lead count from HeyReach Lead Analytics">Lead Analytics <span class="sort-arrow">↕</span></th>
          <th class="th-r" style="width:70px" onclick="setSort('pending')" id="th-pending">Pending <span class="sort-arrow">↕</span></th>
          <th class="th-r" style="width:80px" onclick="setSort('connCheck')" id="th-connCheck" title="Leads at Is Connection check step">Conn. Check <span class="sort-arrow">↕</span></th>
          <th class="th-r" style="width:90px" onclick="setSort('remaining')" id="th-remaining" title="(Total − Lead Analytics) + Pending + Conn. Check">Remaining Leads <span class="sort-arrow">↕</span></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
      <tfoot id="tfoot"></tfoot>
    </table>
  </div>
</div>

</div>


<script>
const DATA = [];
let CAPACITY = null;

const SENDER_COLORS = [
  '#4a7fc1', // blue
  '#9b4a4a', // terracotta
  '#4a8a5d', // green
  '#7a5a9b', // purple
  '#8a6a4a', // brown
  '#4a8a8a', // teal
  '#9b6a3a', // orange
  '#5a7a4a', // olive
];

function senderColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
  return SENDER_COLORS[hash % SENDER_COLORS.length];
}

const STATUS_ORDER = { IN_PROGRESS:0, PAUSED:1, FINISHED:2, DRAFT:3, CANCELED:4 };
const BADGE_CLS    = { IN_PROGRESS:'b-run', PAUSED:'b-pause', FINISHED:'b-fin', DRAFT:'b-draft', CANCELED:'b-fail' };
const BADGE_LABEL  = { IN_PROGRESS:'Active', PAUSED:'Paused', FINISHED:'Finished', DRAFT:'Draft', CANCELED:'Canceled' };

let activeFilter = 'ALL';
// null = no sender filter (show all). Set = show only campaigns whose senders intersect the set.
let selectedSenders = null;
let sortKey = 'status';
let sortAsc = false;

/* ── Daily connection quota (fillometer) ──
   Answers one question per sender: is there enough lead inventory left to fill today's
   connection-request limit? Bar width is that sender's daily limit, split three ways —
   already sent, covered by queued leads, and the gap with no leads behind it. */
function renderQuota() {
  const el = document.getElementById('quotaPanel');
  if (!el) return;
  if (!CAPACITY || CAPACITY.error || !(CAPACITY.senders ?? []).length) {
    // With a workspace on screen, say why the panel is empty rather than rendering nothing,
    // which just looks like a broken page. Two different reasons, two different fixes:
    // a cached sync from before this panel existed, or the proxy routes not being deployed.
    if (DATA.length) {
      const [msg, pill] = CAPACITY?.error
        ? [`Could not load quota data — ${CAPACITY.error}`, 'unavailable']
        : [`Not loaded yet — hit \u21bb to fetch today's send counts and per-sender limits.`, 'needs a refresh'];
      el.style.display = '';
      el.innerHTML = `<div class="quota-head"><div>
          <div class="quota-title">Daily connection quota</div>
          <div class="quota-sub">${msg}</div>
        </div><div class="quota-pill q-unk">${pill}</div></div>`;
      return;
    }
    el.style.display = 'none';
    el.innerHTML = '';
    return;
  }
  el.style.display = '';

  // Worst first: biggest shortfall, then anything we could not measure, then the rest.
  const senders = [...CAPACITY.senders].sort((a, b) =>
    (b.shortfall ?? -1) - (a.shortfall ?? -1) || a.name.localeCompare(b.name));

  const measured   = senders.filter(s => s.sentToday !== null);
  const totalLimit = measured.reduce((t, s) => t + s.dailyLimit, 0);
  const totalSent  = measured.reduce((t, s) => t + s.sentToday, 0);
  const totalQueued = senders.reduce((t, s) => t + s.queued, 0);
  const atRisk     = senders.filter(s => (s.shortfall ?? 0) > 0);
  const totalShort = atRisk.reduce((t, s) => t + s.shortfall, 0);
  const unmeasured = senders.length - measured.length + senders.filter(s => s.blockedReason).length;

  const pill = totalShort > 0
    ? `<div class="quota-pill q-risk">re-up ${totalShort} lead${totalShort === 1 ? '' : 's'}</div>`
    : unmeasured > 0
      ? `<div class="quota-pill q-unk">${unmeasured} sender${unmeasured === 1 ? '' : 's'} need a look</div>`
      : `<div class="quota-pill q-ok">quota covered</div>`;

  const rows = senders.map(s => {
    const limit = Math.max(s.dailyLimit, 1);
    const sent  = s.sentToday ?? 0;
    // With today's sends unknown, still show inventory against the whole limit — the panel's
    // question is "are there leads?", and a flat empty bar would read as "nothing queued".
    const cov   = s.sentToday === null
      ? Math.min(s.queued, s.dailyLimit)
      : Math.min(s.queued, Math.max(0, s.dailyLimit - sent));
    const gap   = s.shortfall ?? 0;
    const pct   = n => `${(Math.min(n, limit) / limit * 100).toFixed(1)}%`;
    const first = s.name.split(' ')[0];

    const flag = s.blockedReason
      ? `<div class="quota-flag q-unk" title="${s.blockedReason}">blocked</div>`
      : s.sentToday === null
        ? `<div class="quota-flag q-unk" title="today's stats could not be read">no data</div>`
        : gap > 0
          ? `<div class="quota-flag q-risk">re-up ${gap}</div>`
          : `<div class="quota-flag q-ok">covered</div>`;

    const nums = s.sentToday === null
      ? `stats unavailable · ${s.queued.toLocaleString()} queued`
      : `<b>${sent}</b>/${s.dailyLimit} sent · ${s.queued.toLocaleString()} queued`;

    const tip = s.blockedReason
      ? `${s.name}: ${s.blockedReason} — adding leads will not fix this`
      : `${s.name}: ${sent} sent, ${cov} more covered by queued leads, ${gap} short of a ${s.dailyLimit}/day limit`;

    return `<div class="quota-row">
      <div class="quota-name"><span class="sender-badge" style="background:${senderColor(s.name)}">${first}</span>${s.name}</div>
      <div class="quota-bar" title="${tip}">
        <div class="qseg q-sent" style="width:${pct(sent)}"></div>
        <div class="qseg q-cov"  style="width:${pct(cov)}"></div>
        <div class="qseg q-gap"  style="width:${pct(gap)}"></div>
      </div>
      <div class="quota-nums">${nums}</div>
      ${flag}
    </div>`;
  }).join('');

  const n = CAPACITY.activeCampaigns;
  const skipped = CAPACITY.excludedCampaigns ?? 0;
  el.innerHTML = `
    <div class="quota-head">
      <div>
        <div class="quota-title">Daily connection quota</div>
        <div class="quota-sub">${totalSent.toLocaleString()} of ${totalLimit.toLocaleString()} connection requests sent today · ${totalQueued.toLocaleString()} leads queued across ${n} connection-request campaign${n === 1 ? '' : 's'}${skipped ? ` · ${skipped} not counted (no connection-request step)` : ''}</div>
      </div>
      ${pill}
    </div>
    <div class="quota-rows">${rows}</div>
    <div class="quota-legend">
      <span><i class="quota-key" style="background:var(--q-fill)"></i>sent today</span>
      <span><i class="quota-key" style="background:var(--q-fill);opacity:.45"></i>covered by queued leads</span>
      <span><i class="quota-key" style="background:var(--q-gap)"></i>short — nothing left to send</span>
      <span style="margin-left:auto">bar width = that sender\u2019s daily limit</span>
    </div>`;
}

/* ── KPI ── */
function buildKPIs() {
  const active = DATA.filter(d => d.status === 'IN_PROGRESS');
  const totalLeads    = DATA.reduce((s,d) => s + d.total, 0);
  const totalSeq      = active.reduce((s,d) => s + d.inProgress, 0);
  const totalPending  = DATA.reduce((s,d) => s + d.pending, 0);
  const totalFinished = DATA.reduce((s,d) => s + d.finished, 0);
  // Sum connCheck for active campaigns; mark as estimated if any value is estimated
  const connActive = active.filter(d => d.connCheck !== null);
  const totalConn = connActive.reduce((s,d) => s + d.connCheck, 0);

  const kpis = [
    { label:'Active Campaigns', val: active.length,                   cls:'k-run',  sub:`of ${DATA.length} total` },
    { label:'Total Leads',      val: totalLeads.toLocaleString(),      cls:'k-tot',  sub:'across all campaigns' },
    { label:'In Sequence',      val: totalSeq.toLocaleString(),        cls:'k-run',  sub:'active campaigns only' },
    { label:'Conn. Check',      val: totalConn.toLocaleString(),       cls:'k-conn', sub:'at Is Connection check step' },
    { label:'Pending',          val: totalPending.toLocaleString(),    cls:'k-paus', sub:'not yet started' },
    { label:'Completed',        val: totalFinished.toLocaleString(),   cls:'k-fin',  sub:'finished sequence' },
  ];
  document.getElementById('kpiRow').innerHTML = kpis.map(k => `
    <div class="kpi">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-num ${k.cls}">${k.val}</div>
      <div class="kpi-sub">${k.sub}</div>
    </div>`).join('');
}

/* ── Filters ── */
function buildFilters() {
  const statusGroups = [
    { key:'ALL',         label:'All' },
    { key:'IN_PROGRESS', label:'Active' },
    { key:'PAUSED',      label:'Paused' },
    { key:'FINISHED',    label:'Finished' },
    { key:'DRAFT',       label:'Draft' },
  ];
  const counts = {};
  DATA.forEach(d => { counts[d.status] = (counts[d.status]||0)+1; });

  document.getElementById('filters').innerHTML = statusGroups.map(g => {
    const n = g.key==='ALL' ? DATA.length : (counts[g.key]||0);
    const on = activeFilter===g.key ? 'on' : '';
    return `<button class="filter-btn ${on}" onclick="setFilter('${g.key}')">${g.label}<span class="filter-pill">${n}</span></button>`;
  }).join('');

  renderSenderFilterHeader();
}

function renderSenderFilterHeader() {
  const th = document.getElementById('th-sender');
  if (!th) return;
  const isFiltered = selectedSenders !== null;
  th.innerHTML = `SENDER ${isFiltered ? '<span class="sender-filter-dot"></span>' : ''}<button class="col-filter-btn" onclick="toggleSenderDropdown(event)" title="Filter by sender">▾</button>`;
}

/* ── Table ── */
function renderTable() {
  sortKey = document.getElementById('sortSelect').value;
  const searchQ = (document.getElementById('campaignSearch')?.value ?? '').trim().toLowerCase();
  document.getElementById('searchClear')?.classList.toggle('visible', searchQ.length > 0);

  let filtered = activeFilter==='ALL' ? DATA : DATA.filter(d => d.status===activeFilter);
  if (selectedSenders !== null) filtered = filtered.filter(d => d.senders?.some(s => selectedSenders.has(s)));
  if (searchQ) filtered = filtered.filter(d => d.name.toLowerCase().includes(searchQ));

  const sorted = [...filtered].sort((a,b) => {
    if (sortKey==='name')   return a.name.localeCompare(b.name) * (sortAsc?1:-1);
    if (sortKey==='status') return (STATUS_ORDER[a.status]??9) - (STATUS_ORDER[b.status]??9);
    // null values sort to the bottom
    if (sortKey==='connCheck') {
      const av = a.connCheck ?? -1, bv = b.connCheck ?? -1;
      return (bv - av) * (sortAsc?-1:1);
    }
    if (sortKey==='analyticsCount') {
      const av = (a.leadCount ?? a.total), bv = (b.leadCount ?? b.total);
      return (bv - av) * (sortAsc?-1:1);
    }
    if (sortKey==='remaining') {
      const calc = r => r.connCheck !== null ? (r.total - (r.leadCount ?? r.total)) + r.pending + r.connCheck : -1;
      return (calc(b) - calc(a)) * (sortAsc?-1:1);
    }
    return (b[sortKey] - a[sortKey]) * (sortAsc?-1:1);
  });

  // Compute totals over the visible sorted rows
  let tTotal = 0, tAnalytics = 0, tPending = 0, tConn = 0, tRemaining = 0;
  let anyConn = false;
  for (const row of sorted) {
    const analyticsCount = row.leadCount ?? row.total;
    tTotal     += row.total;
    tAnalytics += analyticsCount;
    tPending   += row.pending;
    if (row.connCheck !== null) { tConn += row.connCheck; anyConn = true; }
    if (row.connCheck !== null) {
      tRemaining += (row.total - analyticsCount) + row.pending + row.connCheck;
    }
  }
  document.getElementById('tfoot').innerHTML = sorted.length === 0 ? '' : `<tr>
    <td class="tfoot-label">Total (${sorted.length} campaign${sorted.length === 1 ? '' : 's'})</td>
    <td></td>
    <td></td>
    <td class="num-cell"><span class="num-big">${tTotal.toLocaleString()}</span></td>
    <td class="num-cell"><span class="num-big" style="color:var(--t2)">${tAnalytics.toLocaleString()}</span></td>
    <td class="num-cell"><span class="num-big num-pend">${tPending.toLocaleString()}</span></td>
    <td class="num-cell">${anyConn ? `<span class="num-big num-conn">${tConn.toLocaleString()}</span>` : `<span class="num-nil">—</span>`}</td>
    <td class="num-cell"><span class="tfoot-remaining">${anyConn ? tRemaining.toLocaleString() : '—'}</span></td>
  </tr>`;

  document.getElementById('tbody').innerHTML = sorted.map(row => {
    const bc = BADGE_CLS[row.status] || 'b-draft';
    const bl = BADGE_LABEL[row.status] || row.status;

    const senderDisp = row.senders?.length
      ? row.senders.map(s => {
          const first = s.split(' ')[0];
          return `<span class="sender-badge" style="background:${senderColor(s)}">${first}</span>`;
        }).join('')
      : `<span class="num-nil">—</span>`;

    const connDisp = row.connCheck === null
      ? `<span class="num-nil">—</span>`
      : `<span class="num-big num-conn">${row.connCheck.toLocaleString()}</span>`;

    // Lead Analytics count: from API if available, falls back to progressStats total
    const analyticsCount = row.leadCount ?? row.total;

    // Remaining Leads = (Total − Lead Analytics) + Pending + Conn. Check
    const remaining = row.connCheck !== null
      ? (row.total - analyticsCount) + row.pending + row.connCheck
      : null;
    const remainingDisp = remaining === null
      ? `<span class="num-nil">—</span>`
      : `<span style="font-size:15px;font-weight:700;color:#ffffff;font-variant-numeric:tabular-nums">${remaining.toLocaleString()}</span>`;

    return `<tr>
      <td class="td-name">
        <a class="camp-name" href="https://app.heyreach.io/app/campaign/view/${row.id}/performance" target="_blank" rel="noopener" title="${row.name}">${row.name}</a>
        <span class="camp-id">#${row.id}</span>
      </td>
      <td><span class="badge ${bc}"><span class="bdot"></span>${bl}</span></td>
      <td class="td-sender">${senderDisp}</td>
      <td class="num-cell"><span class="num-big">${row.total.toLocaleString()}</span></td>
      <td class="num-cell"><span class="num-big" style="color:var(--t2)">${analyticsCount.toLocaleString()}</span></td>
      <td class="num-cell"><span class="num-big num-pend">${row.pending.toLocaleString()}</span></td>
      <td class="num-cell">${connDisp}</td>
      <td class="num-cell">${remainingDisp}</td>
    </tr>`;
  }).join('');
}

function setFilter(key) {
  activeFilter = key;
  buildFilters();
  renderTable();
}

function toggleSenderDropdown(e) {
  e.stopPropagation();
  const existing = document.getElementById('senderDropdown');
  if (existing) { existing.remove(); return; }

  const allSenders = [...new Set(DATA.flatMap(d => d.senders ?? []))].sort();
  if (!allSenders.length) return;

  const effectiveSelected = selectedSenders !== null ? selectedSenders : new Set(allSenders);
  const allChecked = selectedSenders === null;

  const btn = e.currentTarget;
  const rect = btn.getBoundingClientRect();

  const dd = document.createElement('div');
  dd.id = 'senderDropdown';
  dd.className = 'col-filter-dropdown';
  dd.addEventListener('click', ev => ev.stopPropagation());

  dd.innerHTML = `
    <div class="cfd-header">
      <span>Filter by Sender</span>
      <button class="cfd-clear" onclick="clearSenderFilter()">Clear</button>
    </div>
    <label class="cfd-row cfd-select-all-row">
      <input type="checkbox" id="cfd-select-all" ${allChecked ? 'checked' : ''} onchange="toggleSelectAll(this.checked)">
      <span class="cfd-name" style="font-weight:600;color:var(--t1)">Select All</span>
    </label>
    <div class="cfd-divider"></div>
    ${allSenders.map(s => {
      const first = s.split(' ')[0];
      const last  = s.split(' ').slice(1).join(' ');
      const n     = DATA.filter(d => d.senders?.includes(s)).length;
      const chk   = effectiveSelected.has(s) ? 'checked' : '';
      return `<label class="cfd-row">
        <input type="checkbox" ${chk} data-sender="${s}" onchange="toggleSender(event)">
        <span class="cfd-name">${first} <span class="cfd-lastName">${last}</span></span>
        <span class="cfd-count">${n}</span>
      </label>`;
    }).join('')}
    <div class="cfd-footer">
      <button class="cfd-apply" onclick="closeSenderDropdown()">Done</button>
    </div>
  `;

  dd.style.top  = (rect.bottom + window.scrollY + 6) + 'px';
  dd.style.left = Math.max(8, rect.left + window.scrollX - 170) + 'px';
  document.body.appendChild(dd);

  setTimeout(() => document.addEventListener('click', closeSenderDropdown, { once: true }), 0);
}

function closeSenderDropdown() {
  document.getElementById('senderDropdown')?.remove();
}

function toggleSender(e) {
  const allSenders = [...new Set(DATA.flatMap(d => d.senders ?? []))];

  // Materialise implicit "all selected" if needed
  if (selectedSenders === null) selectedSenders = new Set(allSenders);

  if (e.target.checked) selectedSenders.add(e.target.dataset.sender);
  else selectedSenders.delete(e.target.dataset.sender);

  // If all senders are checked again, revert to null (no filter = show all)
  if (selectedSenders.size === allSenders.length) selectedSenders = null;

  // Sync the Select All checkbox state
  const sa = document.getElementById('cfd-select-all');
  if (sa) sa.checked = selectedSenders === null;

  renderSenderFilterHeader();
  renderTable();
}

function toggleSelectAll(checked) {
  if (checked) {
    // Select All → check every sender, remove filter
    selectedSenders = null;
    document.querySelectorAll('#senderDropdown input[data-sender]').forEach(cb => cb.checked = true);
  } else {
    // Deselect All → uncheck every sender
    selectedSenders = new Set();
    document.querySelectorAll('#senderDropdown input[data-sender]').forEach(cb => cb.checked = false);
  }
  renderSenderFilterHeader();
  renderTable();
}

function clearSenderFilter() {
  // Clear = uncheck all individual senders
  selectedSenders = new Set();
  document.querySelectorAll('#senderDropdown input[data-sender]').forEach(cb => cb.checked = false);
  const sa = document.getElementById('cfd-select-all');
  if (sa) sa.checked = false;
  renderSenderFilterHeader();
  renderTable();
}

function clearSearch() {
  const el = document.getElementById('campaignSearch');
  if (el) el.value = '';
  document.getElementById('searchClear')?.classList.remove('visible');
  renderTable();
}

function setSort(key) {
  if (sortKey===key) sortAsc = !sortAsc;
  else { sortKey = key; sortAsc = false; }
  document.getElementById('sortSelect').value = key;
  document.querySelectorAll('thead th').forEach(th => th.classList.remove('sorted'));
  const el = document.getElementById('th-'+key);
  if (el) el.classList.add('sorted');
  renderTable();
}

buildKPIs();
buildFilters();
renderTable();

/* ══════════════════════════════════════════════
   WORKSPACE / API KEY MANAGEMENT
   ══════════════════════════════════════════════ */
// Calls go to local proxy (/heyreach-api/*) which forwards to HeyReach — avoids CORS.
const HR_API = '/api';
const DEMO_ID = '__demo__';

let workspaces = JSON.parse(localStorage.getItem('hr_workspaces') || '[]');
let activeWsId  = localStorage.getItem('hr_active_ws') || DEMO_ID;

function saveWsStore() {
  localStorage.setItem('hr_workspaces', JSON.stringify(workspaces));
}

/* ── Build the <select> dropdown ── */
function renderWsSelect() {
  const sel = document.getElementById('wsSelect');
  // keep demo option, add saved workspaces
  sel.innerHTML = `<option value="${DEMO_ID}">Demo Data</option>` +
    workspaces.map(w =>
      `<option value="${w.id}">${w.name}</option>`
    ).join('');
  sel.value = activeWsId;
}

/* ── Settings modal ── */
function openSettings() {
  renderWsList();
  document.getElementById('wsName').value = '';
  document.getElementById('wsKey').value  = '';
  document.getElementById('apiError').style.display = 'none';
  document.getElementById('xferPanel').style.display = 'none';
  document.getElementById('xferBox').value = '';
  document.getElementById('settingsModal').classList.remove('hidden');
}
function closeSettings() {
  document.getElementById('settingsModal').classList.add('hidden');
}
document.getElementById('settingsModal').addEventListener('click', e => {
  if (e.target === document.getElementById('settingsModal')) closeSettings();
});

function renderWsList() {
  const el = document.getElementById('wsList');
  if (!workspaces.length) {
    el.innerHTML = '<div style="font-size:12px;color:var(--t3);text-align:center;padding:8px 0">No workspaces yet — add one below.</div>';
    return;
  }
  el.innerHTML = workspaces.map(w => `
    <div class="ws-item ${w.id === activeWsId ? 'active' : ''}" onclick="switchWorkspace('${w.id}');closeSettings()">
      <div class="ws-dot"></div>
      <div class="ws-info">
        <div class="ws-name">${w.name}</div>
        <div class="ws-key-hint">API key: ••••${w.key.slice(-6)}${w.lastSync ? ' · synced ' + new Date(w.lastSync).toLocaleTimeString() : ' · never synced'}</div>
      </div>
      <button class="ws-del" onclick="event.stopPropagation();deleteWorkspace('${w.id}')" title="Remove">✕</button>
    </div>`).join('');
}

async function saveWorkspace() {
  const name = document.getElementById('wsName').value.trim();
  const key  = document.getElementById('wsKey').value.trim();
  const errEl = document.getElementById('apiError');
  const btn   = document.getElementById('saveWsBtn');
  errEl.style.display = 'none';

  if (!name || !key) { showApiError('Please fill in both fields.'); return; }

  btn.textContent = 'Fetching…';
  btn.disabled = true;

  try {
    const data = await fetchCampaigns(key);
    const capacity = await fetchCapacity(key, data);
    const ws = { id: 'ws_' + Date.now(), name, key, lastSync: Date.now(), data, capacity };
    workspaces.push(ws);
    saveWsStore();
    // renderWsSelect() first: switchWorkspace sets the <select>'s value, so the new <option>
    // has to exist by then or the dropdown silently falls back to showing Demo Data.
    renderWsSelect();
    switchWorkspace(ws.id);
    closeSettings();
  } catch(e) {
    showApiError('Could not reach HeyReach API. Check your API key and network. (' + e.message + ')');
  } finally {
    btn.textContent = 'Save & Fetch Data';
    btn.disabled = false;
  }
}

function showApiError(msg) {
  const el = document.getElementById('apiError');
  el.textContent = msg;
  el.style.display = 'block';
}

function deleteWorkspace(id) {
  workspaces = workspaces.filter(w => w.id !== id);
  saveWsStore();
  if (activeWsId === id) switchWorkspace(DEMO_ID);
  else renderWsList();
  renderWsSelect();
}

/* ── Switch active workspace ── */
function switchWorkspace(id) {
  activeWsId = id;
  localStorage.setItem('hr_active_ws', id);
  document.getElementById('wsSelect').value = id;

  if (id === DEMO_ID) {
    DATA.length = 0;
    CAPACITY = null;
    document.getElementById('syncLabel').textContent = 'No workspace — add one via ⚙';
    document.getElementById('syncStatus').textContent = '';
    document.getElementById('syncStatus').className = 'sync-status';
  } else {
    const ws = workspaces.find(w => w.id === id);
    if (ws?.data) {
      loadWorkspaceData(ws);
    }
  }
  buildKPIs(); renderQuota(); buildFilters(); renderTable();
}

function loadWorkspaceData(ws) {
  DATA.length = 0;
  CAPACITY = ws.capacity ?? null;
  (ws.data ?? []).forEach(d => DATA.push(d));
  // An imported workspace has never been synced, so guard the dates — new Date(null) formats
  // as "Invalid Date", and claiming sync-ok for it would be a lie.
  const synced = ws.lastSync ? new Date(ws.lastSync) : null;
  document.getElementById('syncLabel').textContent =
    ws.name + (synced ? ' · ' + synced.toLocaleDateString() : ' · never synced');
  document.getElementById('syncStatus').textContent =
    synced ? 'synced ' + synced.toLocaleString() : 'hit ↻ to fetch data';
  document.getElementById('syncStatus').className = 'sync-status' + (synced ? ' sync-ok' : '');
}

/* ── Workspace transfer ──
   Workspaces live in localStorage, which is scoped per origin, so moving the dashboard to a
   different domain leaves them behind. These move the set across as a pasteable bundle. Only
   name and key travel; campaign data is re-fetched on the other side. */
function exportWorkspaces() {
  const box = document.getElementById('xferBox');
  document.getElementById('xferPanel').style.display = 'block';
  document.getElementById('xferActions').innerHTML = '';
  if (!workspaces.length) {
    box.value = '';
    setXferNote('No workspaces saved yet — nothing to export.');
    return;
  }
  box.value = JSON.stringify({
    kind: 'heyreach-dashboard-workspaces',
    version: 1,
    exportedAt: new Date().toISOString(),
    workspaces: workspaces.map(w => ({ name: w.name, key: w.key })),
  }, null, 2);
  document.getElementById('xferActions').innerHTML =
    '<button class="btn-ghost" onclick="copyXfer()">Copy to clipboard</button>';
  setXferNote(`${workspaces.length} workspace${workspaces.length === 1 ? '' : 's'}. This contains HeyReach API keys in plaintext — treat it like a password, and do not paste it into Slack, Notion or a ticket.`, true);
  box.focus();
  box.select();
}

function beginImport() {
  const box = document.getElementById('xferBox');
  box.value = '';
  document.getElementById('xferPanel').style.display = 'block';
  document.getElementById('xferActions').innerHTML =
    '<button class="btn-ghost" onclick="importWorkspaces()">Import bundle</button>';
  setXferNote('Paste a bundle exported from another browser or domain. Existing workspaces are kept, and a matching name has its key updated.');
  box.focus();
}

async function copyXfer() {
  const box = document.getElementById('xferBox');
  try {
    await navigator.clipboard.writeText(box.value);
    setXferNote('Copied. Remember it holds API keys in plaintext.', true);
  } catch (_) {
    // Clipboard access can be refused; leaving the text selected still lets them copy it.
    box.focus();
    box.select();
    setXferNote('Clipboard was blocked — the text is selected, copy it manually.', true);
  }
}

function importWorkspaces() {
  const raw = document.getElementById('xferBox').value.trim();
  if (!raw) { setXferNote('Nothing to import — paste a bundle first.'); return; }

  let parsed;
  try { parsed = JSON.parse(raw); }
  catch (err) { setXferNote('That is not valid JSON: ' + err.message); return; }

  // Accept a bare array too, so a hand-written list works as well as an exported bundle.
  const incoming = Array.isArray(parsed) ? parsed : parsed?.workspaces;
  if (!Array.isArray(incoming)) { setXferNote('No workspaces found in that bundle.'); return; }

  const valid = incoming.filter(w =>
    w && typeof w.name === 'string' && typeof w.key === 'string' && w.name.trim() && w.key.trim());
  if (!valid.length) { setXferNote('No entries carried both a name and an API key.'); return; }

  let added = 0, updated = 0;
  for (const w of valid) {
    const name = w.name.trim(), key = w.key.trim();
    const existing = workspaces.find(x => x.name === name);
    if (existing) { existing.key = key; updated++; }
    else { workspaces.push({ id: 'ws_' + Date.now() + '_' + added, name, key, lastSync: null, data: [] }); added++; }
  }
  saveWsStore();
  renderWsSelect();
  renderWsList();

  const skipped = incoming.length - valid.length;
  setXferNote(`Imported ${added} new${updated ? `, updated ${updated}` : ''}${skipped ? `, skipped ${skipped} incomplete` : ''}. Pick one from the dropdown and hit ↻ to fetch its data.`, true);
  document.getElementById('xferBox').value = '';
  document.getElementById('xferActions').innerHTML = '';
}

function setXferNote(msg, warn) {
  const el = document.getElementById('xferNote');
  el.textContent = msg;
  el.className = warn ? 'xfer-warn' : 'xfer-note';
}

/* ── Refresh live data for active workspace ── */
async function refreshActive() {
  if (activeWsId === DEMO_ID) {
    alert('Demo mode — add a workspace with an API key to fetch live data.');
    return;
  }
  const ws = workspaces.find(w => w.id === activeWsId);
  if (!ws) return;

  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  document.getElementById('syncStatus').textContent = 'Fetching…';
  document.getElementById('syncStatus').className = 'sync-status';

  try {
    ws.data = await fetchCampaigns(ws.key);
    ws.capacity = await fetchCapacity(ws.key, ws.data);
    ws.lastSync = Date.now();
    saveWsStore();
    loadWorkspaceData(ws);
    buildKPIs(); renderQuota(); buildFilters(); renderTable();
  } catch(e) {
    document.getElementById('syncStatus').textContent = 'Error: ' + e.message;
    document.getElementById('syncStatus').className = 'sync-status sync-err';
  } finally {
    btn.classList.remove('spinning');
  }
}

/* ── HeyReach API calls ── */
async function hrPost(apiKey, path, body = {}) {
  const url = `${HR_API}${path}`;
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'X-API-KEY': apiKey, 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const txt = await res.text().catch(() => '');
    throw new Error(`HTTP ${res.status} on POST ${url}${txt ? ' → ' + txt.slice(0,120) : ''}`);
  }
  return res.json();
}

/* ── Today's connection capacity, per sender ──
   queuedBySender is already tallied during the campaign lead pass, so this costs only one
   li_account call plus one stats call per sender. */
async function hrGet(apiKey, path) {
  const res = await fetch(`${HR_API}${path}`, { headers: { 'X-API-KEY': apiKey } });
  if (!res.ok) {
    const txt = await res.text().catch(() => '');
    throw new Error(`HTTP ${res.status} on GET ${path}${txt ? ' → ' + txt.slice(0,120) : ''}`);
  }
  return res.json();
}

/* Steps that send a message rather than a connection request. */
const MESSAGING_NODES = new Set(['MESSAGE', 'INMAIL', 'MESSAGE_INMAIL', 'VOICE_NOTE']);

/* Does this sequence open by sending a connection request? Only those consume a sender's
   daily CR budget. A first-degree campaign targets existing connections and opens straight
   at MESSAGE, so counting its leads would be phantom inventory that hides real shortfalls.
   CHECK_IS_CONNECTION is a gate rather than a send, so both branches are followed. */
function sendsConnectionRequests(node) {
  if (!node || typeof node !== 'object') return false;
  const type = node.nodeType;
  if (type === 'CONNECTION_REQUEST') return true;
  if (MESSAGING_NODES.has(type)) return false;
  return sendsConnectionRequests(node.conditionalNode) || sendsConnectionRequests(node.unconditionalNode);
}

async function fetchCapacity(apiKey, campaigns) {
  const active = campaigns.filter(c => c.status === 'IN_PROGRESS');

  let accounts;
  try {
    accounts = (await hrPost(apiKey, '/li_account/GetAll', { offset: 0, limit: 100 })).items ?? [];
  } catch (err) {
    // This panel is additive, so a failure here must never take the campaign table down with
    // it. A deployment without the api/li_account and api/stats proxy routes lands right here.
    return { senders: [], activeCampaigns: active.length, error: err.message, fetchedAt: Date.now() };
  }

  // Keep only the campaigns that actually send connection requests.
  const sendsCr = await Promise.all(active.map(async c => {
    try { return sendsConnectionRequests(await hrGet(apiKey, `/campaign/GetCampaignSequence?campaignId=${c.id}`)); }
    catch (_) { return true; }  // unreadable: over-count rather than invent a shortfall
  }));
  const crCampaigns = active.filter((_, i) => sendsCr[i]);

  const queued = {};
  for (const c of crCampaigns) {
    for (const [sid, count] of Object.entries(c.queuedBySender ?? {})) {
      queued[sid] = (queued[sid] ?? 0) + count;
    }
  }

  // UTC day is equivalent to the sending day here: nothing sends between midnight and 14:00 UTC.
  const day = new Date().toISOString().slice(0, 10);

  const senders = await Promise.all(accounts.filter(a => a.isActive).map(async a => {
    const limits = a.accountLimits ?? {};
    // HeyReach's own spelling — the 'n' really is missing from connectioRequestLimit
    const dailyLimit = limits.connectioRequestLimit ?? 0;

    let sentToday = null;
    try {
      const stats = await hrPost(apiKey, '/stats/GetOverallStats', {
        accountIds: [a.id], campaignIds: [],
        startDate: `${day}T00:00:00.000Z`, endDate: `${day}T23:59:59.999Z`,
      });
      sentToday = Object.values(stats.byDayStats ?? {}).reduce((t, d) => t + (d.connectionsSent ?? 0), 0);
    } catch (_) {
      // Leave it null so the row reads "no data" rather than showing a false shortfall.
    }

    const q = queued[a.id] ?? 0;
    const blockedReason = !a.authIsValid ? 'LinkedIn auth invalid'
      : a.connectionRequestCooldown ? 'connection-request cooldown'
      : (a.activeCampaigns ?? 0) === 0 ? 'not in any active campaign'
      : null;

    return {
      id: a.id,
      name: `${a.firstName ?? ''} ${a.lastName ?? ''}`.trim().replace(/\s+/g, ' ') || `#${a.id}`,
      dailyLimit,
      sentToday,
      queued: q,
      blockedReason,
      // Null rather than 0 when it cannot be judged, so "unknown" never reads as "fine".
      shortfall: (sentToday === null || blockedReason) ? null
        : Math.max(0, Math.max(0, dailyLimit - sentToday) - q),
    };
  }));

  return {
    senders,
    activeCampaigns: crCampaigns.length,
    excludedCampaigns: active.length - crCampaigns.length,
    fetchedAt: Date.now(),
  };
}

async function fetchCampaigns(apiKey) {
  const json = await hrPost(apiKey, '/campaign/GetAll', { offset: 0, limit: 100 });
  const items = json.items ?? json;

  const campaigns = items.map(c => ({
    id:         c.id,
    name:       c.name,
    status:     c.status,
    total:      c.progressStats?.totalUsers ?? 0,
    inProgress: c.progressStats?.totalUsersInProgress ?? 0,
    pending:    c.progressStats?.totalUsersPending ?? 0,
    finished:   c.progressStats?.totalUsersFinished ?? 0,
    failed:     c.progressStats?.totalUsersFailed ?? 0,
    stopped:    c.progressStats?.totalUsersManuallyStopped ?? 0,
    excluded:   c.progressStats?.totalUsersExcluded ?? 0,
    connCheck:  null,
    leadCount:  null,
    senders:    null,
  }));

  // Active campaigns: paginate all leads for connCheck + senders + leadCount
  const active = campaigns.filter(c => c.status === 'IN_PROGRESS');
  for (let i = 0; i < active.length; i += 3) {
    const batch = active.slice(i, i + 3);
    await Promise.all(batch.map(async c => {
      try {
        let offset = 0, total = null, connCheck = 0;
        const senderNames = new Set();
        const queuedBySender = {};  // sender id -> leads still awaiting a connection request
        do {
          const lj = await hrPost(apiKey, '/campaign/GetLeadsFromCampaign', { campaignId: c.id, offset, limit: 100 });
          if (total === null) { total = lj.totalCount ?? 0; c.leadCount = total; }
          for (const lead of lj.items ?? []) {
            const atConnCheck = lead.leadCampaignStatus === 'InSequence' && lead.leadConnectionStatus === 'None';
            if (atConnCheck) connCheck++;
            // Awaiting a connection request = not started yet, or sitting at the conn. check gate
            if ((atConnCheck || lead.leadCampaignStatus === 'Pending') && lead.linkedInSenderId != null) {
              queuedBySender[lead.linkedInSenderId] = (queuedBySender[lead.linkedInSenderId] ?? 0) + 1;
            }
            if (lead.linkedInSenderFullName) senderNames.add(lead.linkedInSenderFullName);
          }
          offset += 100;
        } while (offset < total);
        c.connCheck = connCheck;
        c.senders = [...senderNames].sort();
        c.queuedBySender = queuedBySender;
      } catch(_) {}
    }));
  }

  // Non-active campaigns: paginate all leads for connCheck + leadCount + senders
  const inactive = campaigns.filter(c => c.status !== 'IN_PROGRESS');
  for (let i = 0; i < inactive.length; i += 3) {
    const batch = inactive.slice(i, i + 3);
    await Promise.all(batch.map(async c => {
      try {
        let offset = 0, total = null, connCheck = 0;
        const senderNames = new Set();
        const queuedBySender = {};  // sender id -> leads still awaiting a connection request
        do {
          const lj = await hrPost(apiKey, '/campaign/GetLeadsFromCampaign', { campaignId: c.id, offset, limit: 100 });
          if (total === null) { total = lj.totalCount ?? 0; c.leadCount = total; }
          for (const lead of lj.items ?? []) {
            const atConnCheck = lead.leadCampaignStatus === 'InSequence' && lead.leadConnectionStatus === 'None';
            if (atConnCheck) connCheck++;
            // Awaiting a connection request = not started yet, or sitting at the conn. check gate
            if ((atConnCheck || lead.leadCampaignStatus === 'Pending') && lead.linkedInSenderId != null) {
              queuedBySender[lead.linkedInSenderId] = (queuedBySender[lead.linkedInSenderId] ?? 0) + 1;
            }
            if (lead.linkedInSenderFullName) senderNames.add(lead.linkedInSenderFullName);
          }
          offset += 100;
        } while (offset < total);
        c.connCheck = connCheck;
        c.senders = [...senderNames].sort();
        c.queuedBySender = queuedBySender;
      } catch(_) {}
    }));
  }

  return campaigns;
}

/* ── Init ── */
renderWsSelect();
if (activeWsId !== DEMO_ID) {
  const ws = workspaces.find(w => w.id === activeWsId);
  if (ws?.data) { loadWorkspaceData(ws); buildKPIs(); renderQuota(); buildFilters(); renderTable(); }
  else switchWorkspace(DEMO_ID);
}
